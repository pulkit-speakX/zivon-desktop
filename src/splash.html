<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Envoy</title>
    <style>
      /* ---- Claude desktop · dark · hardcoded palette ---- */
      :root {
        --bg: #262624;          /* warm dark canvas */
        --panel: #30302e;       /* raised surface  */
        --border: #3a3a37;
        --text: #f5f4ee;        /* cream white     */
        --muted: #a3a097;
        --clay: #c96442;        /* Claude coral / clay accent */
        --clay-hover: #d97757;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%;
        background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-user-select: none; user-select: none;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; padding: 32px; gap: 16px;
      }
      .mark {
        width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
        color: var(--clay); margin-bottom: 6px;
      }
      .mark svg { width: 100%; height: 100%; display: block; }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400; font-size: 28px; margin: 2px 0 0;
        letter-spacing: -0.01em; line-height: 1.15; text-align: center;
      }
      .sub {
        color: var(--muted); font-size: 13.5px; margin: 0; text-align: center;
        max-width: 300px; line-height: 1.5;
      }
      .btn {
        width: 100%; max-width: 300px; border: 0; border-radius: 10px;
        padding: 12px 16px; font-size: 14px; font-weight: 500; cursor: pointer;
        background: var(--clay); color: #fff;
        display: inline-flex; align-items: center; justify-content: center; gap: 9px;
        transition: background .15s, transform .05s; margin-top: 8px;
      }
      .btn:hover { background: var(--clay-hover); }
      .btn:active { transform: translateY(1px); }
      .btn[disabled] { opacity: .55; cursor: default; }
      .btn svg { width: 17px; height: 17px; }
      .status {
        font-size: 12.5px; color: var(--muted); text-align: center; min-height: 18px;
        max-width: 300px; line-height: 1.4;
      }
      .spinner {
        width: 15px; height: 15px; border-radius: 50%;
        border: 2px solid rgba(245,244,238,.2); border-top-color: var(--clay-hover);
        animation: spin .8s linear infinite; display: inline-block; vertical-align: -2px;
        margin-right: 7px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .foot {
        position: fixed; bottom: 18px; left: 0; right: 0;
        color: var(--muted); font-size: 11px; text-align: center; opacity: .7;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1.5c.32 0 .6.2.7.5l1.86 5.27 5.27 1.86c.3.1.5.38.5.7s-.2.6-.5.7l-5.27 1.86-1.86 5.27c-.1.3-.38.5-.7.5s-.6-.2-.7-.5l-1.86-5.27-5.27-1.86c-.3-.1-.5-.38-.5-.7s.2-.6.5-.7l5.27-1.86 1.86-5.27c.1-.3.38-.5.7-.5z"/>
        </svg>
      </div>
      <h1>Welcome to Envoy</h1>
      <p class="sub">Sign in to bring Envoy to your desktop.</p>

      <button class="btn" id="signin">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#fff" d="M21.35 11.1h-9.18v3.83h5.3c-.23 1.34-1.6 3.93-5.3 3.93-3.19 0-5.79-2.64-5.79-5.9s2.6-5.9 5.79-5.9c1.82 0 3.04.78 3.74 1.45l2.55-2.46C17.1 4.62 14.86 3.6 12.17 3.6 7.02 3.6 2.85 7.77 2.85 12.96s4.17 9.36 9.32 9.36c5.38 0 8.95-3.78 8.95-9.1 0-.61-.07-1.08-.17-1.55l.4-.57z"/>
        </svg>
        Sign in with Google
      </button>
      <div class="status" id="status"></div>
    </div>

    <div class="foot">Envoy for macOS</div>

    <script>
      const invoke = window.__TAURI__.core.invoke;
      const $ = (id) => document.getElementById(id);
      const status = $("status");

      $("signin").addEventListener("click", async () => {
        $("signin").disabled = true;
        status.innerHTML =
          '<span class="spinner"></span>Opening your browser… complete sign-in there.';
        try {
          await invoke("cmd_start_login");
        } catch (e) {
          status.textContent = "Could not start sign-in: " + e;
          $("signin").disabled = false;
        }
      });
    </script>
  </body>
</html>
